name: Train TinyLLM

# Training runs on free GitHub-hosted CPU runners (2 cores, no GPU).
#
# Design notes learned the hard way:
#   * A full 3000-step run of the 3.5M model takes ~55 min. The workflow is
#     therefore *chunked*: every invocation trains at most `chunk_minutes` and
#     saves a checkpoint. Re-running continues where it stopped (the cache key
#     is stable, so `restore-keys` finds the previous chunk). You can drive it
#     to completion by re-running, or let the schedule do it.
#   * `runs/` is gitignored — it holds multi-hundred-MB checkpoints. Only
#     `model/` is committed. Passing `runs/...` to `git add` fails the job.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Model config (configs/*.json)"
        required: false
        default: "configs/fast.json"
      max_steps:
        description: "Total optimiser steps for the whole run"
        required: false
        default: "4000"
      batch_size:
        description: "Micro batch size"
        required: false
        default: "32"
      seed:
        description: "Random seed"
        required: false
        default: "1337"
      chunk_minutes:
        description: "Max training minutes for THIS invocation (keeps the job short)"
        required: false
        default: "25"
      reset:
        description: "Ignore the checkpoint cache and start from scratch"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    # a push that touches the trainer or its configs re-runs training; the
    # model commit itself is tagged [skip ci] so it cannot loop
    paths:
      - ".github/workflows/train.yml"
      - "scripts/train.py"
      - "tinyllm/model.py"
      - "tinyllm/tokenizer.py"
      - "tinyllm/dataset.py"
      - "configs/**.json"
  schedule:
    # keep nudging the model forward: each run resumes and adds a chunk
    - cron: "0 4 * * *"

concurrency:
  group: train-tinyllm
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  # 2-core runners: match thread counts to cores, and stop torch thrashing
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  train:
    name: Train chunk + publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy pyyaml pytest

      - name: Runner info
        run: |
          echo "cpus: $(nproc)  mem: $(free -g | awk '/^Mem/{print $2}')GB"
          python -c "import torch; print('torch', torch.__version__)"

      # ---- resumable checkpoint cache ---------------------------------
      # The key is *stable* (it does not contain run_id) so the next run finds
      # the previous chunk via restore-keys and continues training.
      - name: Restore checkpoint cache
        if: ${{ inputs.reset != true }}
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: runs/main
          key: tinyllm-ckpt-v2-${{ inputs.config || 'configs/fast.json' }}-${{ inputs.seed || '1337' }}-${{ github.run_id }}
          restore-keys: |
            tinyllm-ckpt-v2-${{ inputs.config || 'configs/fast.json' }}-${{ inputs.seed || '1337' }}-

      - name: Prepare output directory
        run: |
          mkdir -p runs/main
          if [ -f model/tokenizer.json ] && [ ! -f runs/main/tokenizer.json ]; then
            cp model/tokenizer.json runs/main/tokenizer.json
          fi
          if [ -f runs/main/last.pt ]; then
            echo "::notice::found cached checkpoint — resuming"
            python - <<'PY'
          import torch
          ck = torch.load('runs/main/last.pt', map_location='cpu', weights_only=False)
          print(f"resume step={ck.get('step')} best_val={ck.get('best_val')}")
          PY
          else
            echo "::notice::no cached checkpoint — starting from scratch"
          fi
          ls -la runs/main

      - name: Train
        env:
          CONFIG: ${{ inputs.config || 'configs/fast.json' }}
          MAX_STEPS: ${{ inputs.max_steps || '4000' }}
          BATCH_SIZE: ${{ inputs.batch_size || '32' }}
          SEED: ${{ inputs.seed || '1337' }}
          CHUNK_MINUTES: ${{ inputs.chunk_minutes || '25' }}
        run: |
          set -euo pipefail
          # skip work entirely if the cached checkpoint already reached the target
          DONE=$(python - <<'PY'
          import os, torch
          p = 'runs/main/last.pt'
          print(torch.load(p, map_location='cpu', weights_only=False).get('step', 0) if os.path.exists(p) else 0)
          PY
          )
          echo "cached step: $DONE / target $MAX_STEPS"
          if [ "$DONE" -ge "$MAX_STEPS" ]; then
            echo "::notice::already trained to $DONE steps — nothing to do (set reset=true to start over)"
            exit 0
          fi
          RESUME=""
          [ -f runs/main/last.pt ] && RESUME="--resume runs/main/last.pt"
          python -u scripts/train.py \
            --out-dir runs/main \
            --config "$CONFIG" \
            --tokenizer runs/main/tokenizer.json \
            --max-steps "$MAX_STEPS" \
            --batch-size "$BATCH_SIZE" \
            --seed "$SEED" \
            --threads 2 \
            --time-budget "$CHUNK_MINUTES" \
            --eval-interval 250 \
            --log-interval 50 \
            --save-interval 100 \
            $RESUME

      - name: Training summary
        if: always()
        run: |
          if [ -f runs/main/train_log.json ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open('runs/main/train_log.json'))
          m, h = d['meta'], d['history']
          print("### Run summary\n")
          print("| metric | value |")
          print("|---|---|")
          for k in ("params", "steps", "total_steps_target", "finished", "val_loss", "bits_per_byte",
                    "tokens_seen", "train_seconds", "compiled"):
              print(f"| {k} | {m.get(k)} |")
          print(f"\n**generated:** {m.get('tokens_seen', 0):,} tokens this run\n")
          print("<details><summary>loss history</summary>\n")
          print("```")
          for e in h[-14:]:
              print(e)
          print("```")
          print("</details>")
          PY
          else
            echo "::warning::no train_log.json produced"
          fi

      # ---- publish (model/ only — runs/ is gitignored) ---------------
      - name: Publish artefacts
        run: |
          set -euo pipefail
          mkdir -p model
          for f in weights.json config.json tokenizer.json loss_curve.svg samples.txt; do
            src="runs/main/$f"
            if [ -f "$src" ] && [ "$(readlink -f "$src")" != "$(readlink -f "model/$f" 2>/dev/null || echo x)" ]; then
              cp "$src" "model/$f"
            fi
          done
          if [ -f runs/main/train_log.json ]; then
            cp runs/main/train_log.json model/train_log.json
            python - <<'PY'
          import json
          log = json.load(open('runs/main/train_log.json'))
          meta = dict(log['meta'])
          meta['history'] = log['history']
          json.dump(meta, open('model/meta.json', 'w'), indent=2)
          PY
          fi
          python scripts/update_readme.py || true
          du -h model/* | sort -h

      - name: Save checkpoint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runs/main
          key: tinyllm-ckpt-v2-${{ inputs.config || 'configs/fast.json' }}-${{ inputs.seed || '1337' }}-${{ github.run_id }}

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: tinyllm-${{ github.run_number }}
          path: |
            model/weights.json
            model/meta.json
            model/train_log.json
            model/loss_curve.svg
            model/samples.txt
          retention-days: 90

      - name: Commit trained model
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only model/ and README.md. NEVER runs/ — it is gitignored and a
          # `git add` of an ignored path exits 1, which under `set -e` used to
          # fail this job *after* a successful 56-minute training run.
          git add model/ README.md
          if git diff --cached --quiet; then
            echo "no model changes to commit"
            exit 0
          fi
          STEPS=$(python -c "import json;print(json.load(open('model/meta.json')).get('steps','?'))")
          VAL=$(python -c "import json;print(json.load(open('model/meta.json')).get('val_loss','?'))")
          PARAMS=$(python -c "import json;print(f\"{json.load(open('model/meta.json')).get('params',0):,}\")")
          git commit -m "train: step ${STEPS}, val loss ${VAL}, ${PARAMS} params [skip ci]"
          git push

      # ---- advisory test gate ---------------------------------------
      # Runs *after* the artefacts are published, so a failing/flaky test can
      # never throw away a training chunk. The dedicated Tests workflow is the
      # authoritative gate on every push.
      - name: Test suite (advisory)
        if: always()
        continue-on-error: true
        run: |
          if python -c "import pytest" 2>/dev/null; then
            pytest tests/test_tokenizer.py tests/test_model.py -q
          else
            echo "::warning::pytest unavailable — skipping advisory tests"
          fi
