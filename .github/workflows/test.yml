name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy pytest pyyaml fastapi httpx

      - name: Build the Spore corpus
        # data/spore/ is gitignored (it is derived), but the corpus-quality
        # tests need it.  The build is deterministic and takes ~2 seconds.
        run: python scripts/build_spore_data.py

      - name: Fast unit tests (tokenizer + model shapes + Spore)
        run: pytest tests/test_model.py tests/test_tokenizer.py tests/test_spore.py -q

      - name: Cross-engine parity (needs trained weights)
        run: pytest tests/test_parity.py -q

      - name: Server smoke test
        run: pytest tests/test_server.py -q

  browser-engine:
    name: Browser engine (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Worker smoke test (needs committed weights)
        run: |
          if [ -f model/weights.json ]; then
            node scripts/worker_smoke.mjs model/weights.json
          else
            echo "::notice::no model/weights.json yet — skipping"
          fi
