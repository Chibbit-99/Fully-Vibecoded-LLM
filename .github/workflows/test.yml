name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy pytest fastapi httpx

      - name: Fast unit tests (tokenizer + model shapes)
        run: pytest tests/test_model.py tests/test_tokenizer.py -q

      - name: Cross-engine parity (needs trained weights)
        run: pytest tests/test_parity.py -q

      - name: Server smoke test
        run: pytest tests/test_server.py -q
