name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "model/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check model artefacts exist
        run: |
          test -f model/weights.json || (echo "::error::model/weights.json missing — run the Train workflow first" && exit 1)
          du -h model/weights.json

      - name: Assemble site
        run: |
          mkdir -p _site/model
          cp -r web/. _site/
          cp model/weights.json _site/model/weights.json
          [ -f model/meta.json ] && cp model/meta.json _site/model/meta.json || true
          [ -f model/loss_curve.svg ] && cp model/loss_curve.svg _site/model/ || true
          cat > _site/.nojekyll <<< ""

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
