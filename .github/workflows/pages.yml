name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "model/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the retrieval factbook
        # data/spore/ is generated (gitignored); the browser demo needs the
        # factbook to ground its answers, so rebuild it here.
        run: python scripts/build_spore_data.py

      - name: Check model artefacts exist
        run: |
          # The site is the Spore playground: web/ + model/spore/ + the factbook.
          # Without a checkpoint the page still deploys and shows a setup
          # message, so this warns rather than fails.
          if ls model/spore/*/weights.json >/dev/null 2>&1; then
            echo "Spore checkpoints:"
            du -h model/spore/*/weights.json
          else
            echo "::warning::no model/spore/*/weights.json — the playground will show a setup message"
          fi
          test -f data/spore/factbook.json || (echo "::error::factbook missing; the build step should have created it" && exit 1)

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          # web/ is the whole site: index.html is the Spore playground.
          cp -r web/. _site/

          # Spore checkpoints + the factbook the browser retrieves from
          if [ -d model/spore ]; then
            mkdir -p _site/model/spore
            cp -r model/spore/. _site/model/spore/
          fi
          if [ -f data/spore/factbook.json ]; then
            mkdir -p _site/data/spore
            cp data/spore/factbook.json _site/data/spore/factbook.json
          fi
          touch _site/.nojekyll
          du -sh _site _site/model 2>/dev/null || true

      - name: Enable Pages (idempotent)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
