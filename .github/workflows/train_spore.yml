name: Train Spore (12M / 36M)

# Spore is trained in two stages on free GitHub-hosted CPU runners (2 cores):
#
#   stage 1  pretrain : WikiText-2 + TinyStories prose, next-token prediction
#   stage 2  sft      : chat turns, masked loss on the assistant's tokens only
#
# A 12M model needs ~30-40 minutes of pretraining and ~15 of chat tuning; the
# 36M model needs 3-5 hours of pretraining.  GitHub kills a job at 6 hours, so
# **every invocation trains at most `chunk_minutes` and then stops cleanly**
# (checkpoint = weights + optimizer + RNG + step).  The checkpoint is cached
# between runs, so re-running the same workflow continues exactly where the
# last chunk stopped -- verified bit-identical to one uninterrupted run.
#
# How to drive it to completion
# -----------------------------
#   1. Run this workflow with model=spore-1-12M, stage=pretrain.  Repeat until
#      the job log says "FINISHED" (usually once).
#   2. Run it with stage=sft (same model).  Repeat until FINISHED.
#   3. Run it with model=spore-1-36M and repeat both stages.
# Each run prints `[continue]` or `[done]` and the summary says what is left.
#
# `runs/` is gitignored (multi-hundred-MB checkpoints) and must never be passed
# to `git add` -- that fails the job *after* training succeeds.  Only
# `model/spore/**` is committed.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Which Spore model to train"
        type: choice
        required: true
        default: "spore-1-12M"
        options:
          - "spore-1-12M"
          - "spore-1-36M"
      stage:
        description: "pretrain (prose) then sft (chat)"
        type: choice
        required: true
        default: "pretrain"
        options:
          - "pretrain"
          - "sft"
      chunk_minutes:
        description: "Max training minutes for THIS job (must stay under 6h incl. install)"
        required: false
        default: "300"
      target_tokens:
        description: "Total tokens for the stage (e.g. 20e6). Empty = sensible default"
        required: false
        default: ""
      max_epochs:
        description: "Cap the token budget at this many passes over the corpus (default 4)"
        required: false
        default: "4"
      time_budget_minutes:
        description: "Plan the step count to finish training within this many minutes (0 = off)"
        required: false
        default: "0"
      reset:
        description: "Ignore the checkpoint cache and start this stage from scratch"
        type: boolean
        required: false
        default: false

concurrency:
  # one job per model+stage at a time; the cache is the shared state
  group: spore-${{ inputs.model || 'spore-1-12M' }}-${{ inputs.stage || 'pretrain' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  train:
    name: ${{ inputs.model || 'spore-1-12M' }} / ${{ inputs.stage || 'pretrain' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355   # hard ceiling below GitHub's 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Training runs for hours, so `main` can legitimately advance between
          # dispatch and the commit step (another model's run finishing, a PR
          # merged). The commit step rebases onto main to handle that, which
          # needs real history: the default fetch-depth of 1 gives a shallow
          # clone with no common ancestor, so `git rebase origin/main` fails
          # with "unrelated histories" and the commit is lost after the
          # expensive part has already succeeded.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy pyyaml pytest

      - name: Runner info
        run: |
          echo "cpus: $(nproc)  mem: $(free -g | awk '/^Mem/{print $2}')GB"
          python -c "import torch; print('torch', torch.__version__)"

      # ---- corpus fingerprint ------------------------------------------
      # Computed BEFORE the cache restore because it is part of the cache key.
      # Both inputs are tracked files, so this needs only a checkout.
      - name: Corpus fingerprint
        id: fp
        run: |
          set -euo pipefail
          FP=$( (cat data/raw_wikitext2.txt data/raw_tinystories.txt scripts/build_spore_data.py) \
                 | python -c "import hashlib,sys;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:16])" )
          echo "data_hash=$FP" >> "${GITHUB_OUTPUT:-/dev/stdout}"
          echo "::notice::corpus fingerprint $FP"

      - name: Resolve plan (tokens -> steps)
        id: plan
        run: |
          set -euo pipefail
          MODEL="${{ inputs.model || 'spore-1-12M' }}"
          STAGE="${{ inputs.stage || 'pretrain' }}"
          TARGET_TOKENS="${{ inputs.target_tokens }}"
          case "$MODEL" in
            spore-1-12M) CONFIG=configs/spore_12m.json ;;
            spore-1-36M) CONFIG=configs/spore_36m.json ;;
            *) echo "::error::unknown model $MODEL"; exit 1 ;;
          esac
          # Defaults are chosen so the *epochs stay sane* rather than hitting a
          # round token count. A fixed 40M over a ~2.5M-token corpus was 16
          # passes; the trainer now also clamps with --max-epochs as a backstop.
          if [ -z "$TARGET_TOKENS" ]; then
            if [ "$STAGE" = "pretrain" ]; then
              TARGET_TOKENS=18000000
            else
              TARGET_TOKENS=6000000
            fi
          fi
          echo "config=$CONFIG" >> "${GITHUB_OUTPUT:-/dev/stdout}"
          echo "target_tokens=$TARGET_TOKENS" >> "${GITHUB_OUTPUT:-/dev/stdout}"

          # ---- restore-keys --------------------------------------------------
          # Cache keys are matched by POSITIONAL PREFIX, so these must be
          # literal heads of the keys that were saved.
          #
          # pretrain: one key, pinned to (corpus, tokens, epochs). Pinning
          # matters here: resuming a checkpoint at step 39062 into a 4400-step
          # plan hits `start_step >= max_steps` and silently trains nothing.
          #
          # sft: TWO keys, in order.
          #   1. its own chunks, pinned the same way (the 36M needs 2 jobs);
          #   2. the pretrain checkpoint, deliberately NOT pinned to
          #      tokens/epochs, because SFT targets 6M while pretrain targeted
          #      18M. Pinning would never match. Leaving it loose is safe
          #      precisely because the stage differs: the trainer sees
          #      ckpt_stage != args.stage and starts stage 2 at step 0 from
          #      those *weights*, so the step-count hazard above cannot apply.
          DATA_HASH="${{ steps.fp.outputs.data_hash }}"
          MAX_EPOCHS="${{ inputs.max_epochs || '4' }}"
          PREFIX="spore-ckpt-${MODEL}"
          if [ "$STAGE" = "sft" ]; then
            KEYS="$(printf '%s-sft-%s-%s-%s-\n%s-pretrain-%s-' \
              "$PREFIX" "$DATA_HASH" "$TARGET_TOKENS" "$MAX_EPOCHS" \
              "$PREFIX" "$DATA_HASH")"
          else
            KEYS="$(printf '%s-pretrain-%s-%s-%s-' \
              "$PREFIX" "$DATA_HASH" "$TARGET_TOKENS" "$MAX_EPOCHS")"
          fi
          {
            echo "restore_keys<<__KEYS__"
            echo "$KEYS"
            echo "__KEYS__"
          } >> "${GITHUB_OUTPUT:-/dev/stdout}"
          echo "::notice::$MODEL $STAGE target ${TARGET_TOKENS} tokens using $CONFIG"

      # ---- resumable checkpoint cache ---------------------------------
      # The key includes three things that silently corrupt a resume when they
      # change, none of which are visible to the trainer (it restores step and
      # best_val from last.pt without ever inspecting the data):
      #
      #   data_hash  -- the tokenizer is *reused* from the cached out-dir. If
      #                 the corpus changes, the tokenizer (fit on the old text)
      #                 and the new text disagree, and the <unk> recovery --
      #                 the entire point of the current corpus -- never takes
      #                 effect. This was a real trap: the key used to be
      #                 (model, stage) only, so old checkpoints were restored
      #                 over a rebuilt corpus.
      #   plan       -- the max_steps derived from target_tokens/max_epochs.
      #                 Resuming a checkpoint trained to step 39062 into a plan
      #                 of 4400 steps hits `start_step >= max_steps` and prints
      #                 "nothing to do" without training a single step.
      #
      # restore-keys is deliberately NO LONGER a bare prefix: a prefix match
      # would restore exactly the stale entries this key is meant to exclude.
      - name: Restore checkpoint cache
        if: ${{ inputs.reset != true }}
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            runs/${{ inputs.model || 'spore-1-12M' }}
            data/spore
          key: spore-ckpt-${{ inputs.model || 'spore-1-12M' }}-${{ inputs.stage || 'pretrain' }}-${{ steps.fp.outputs.data_hash }}-${{ steps.plan.outputs.target_tokens }}-${{ inputs.max_epochs || '4' }}-${{ github.run_id }}
          restore-keys: ${{ steps.plan.outputs.restore_keys }}

      - name: Build corpus (cached between runs)
        run: |
          set -euo pipefail
          # single source of truth: the fingerprint computed for the cache key
          DATA_HASH="${{ steps.fp.outputs.data_hash }}"
          echo "data fingerprint: $DATA_HASH"
          if [ -f data/spore/qa.jsonl ] && [ -f data/spore/.hash ] && \
             [ "$(cat data/spore/.hash)" = "$DATA_HASH" ]; then
            echo "::notice::corpus already built for this data revision — reusing"
            python -c "import json;d=json.load(open('data/spore/qa_stats.json'));print({k:d[k] for k in ('records','articles','stories')})"
          else
            python scripts/build_spore_data.py
            echo "$DATA_HASH" > data/spore/.hash
          fi


      - name: Train chunk
        run: |
          set -euo pipefail
          MODEL="${{ inputs.model || 'spore-1-12M' }}"
          STAGE="${{ inputs.stage || 'pretrain' }}"
          case "$MODEL" in
            spore-1-12M) CONFIG=configs/spore_12m.json ;;
            spore-1-36M) CONFIG=configs/spore_36m.json ;;
            *) echo "::error::unknown model $MODEL"; exit 1 ;;
          esac
          # Single source of truth: use the value the "Resolve plan" step
          # computed. This block used to repeat the 40M/12M defaults, so editing
          # them in one place had no effect.
          TARGET_TOKENS="${{ steps.plan.outputs.target_tokens }}"
          CHUNK_MINUTES="${{ inputs.chunk_minutes || '300' }}"
          OUT="runs/$MODEL"
          mkdir -p "$OUT"
          RESUME=""
          if [ -f "$OUT/last.pt" ]; then
            RESUME="--resume $OUT/last.pt"
          CKPT="$OUT/last.pt" python - <<'PY'
          import os, torch
          ck = torch.load(os.environ["CKPT"], map_location="cpu", weights_only=False)
          print(f"::notice::cached checkpoint step={ck.get('step')} "
                f"stage={ck.get('stage')} finished={ck.get('finished')}")
          PY
          else
            echo "::notice::no cached checkpoint — starting this stage from scratch"
            # A pretrain stage starting cold is normal.  An *sft* stage starting
            # cold is not: it means the pretrain checkpoint was never restored
            # (wrong cache, evicted, or reset ticked), and chat-tuning a randomly
            # initialised model produces a run that looks healthy -- loss falls,
            # the job succeeds -- while being useless.  Fail loudly instead.
            if [ "$STAGE" = "sft" ]; then
              echo "::error::sft needs the pretrain checkpoint but none was restored."
              echo "::error::Run stage=pretrain for $MODEL to completion first, or"
              echo "::error::check that its cache still exists and matches the corpus."
              exit 1
            fi
          fi

          python -u scripts/train_spore.py \
            --config "$CONFIG" \
            --out-dir "$OUT" \
            --stage "$STAGE" \
            --token-budget "$TARGET_TOKENS" \
            --chunk-minutes "$CHUNK_MINUTES" \
            --threads 2 \
            --log-interval 25 \
            --save-interval 200 \
            --eval-interval 100 \
            --early-stop-patience 4 \
            --max-epochs "${{ inputs.max_epochs || '4' }}" \
            --time-budget-minutes "${{ inputs.time_budget_minutes || '0' }}" \
            --data-hash "${{ steps.fp.outputs.data_hash }}" \
            --export \
            $RESUME

      - name: Training summary
        if: always()
        run: |
          MODEL="${{ inputs.model || 'spore-1-12M' }}"
          OUT="runs/$MODEL"
          if [ -f "$OUT/train_log.json" ]; then
          OUT="$OUT" python - <<'PY' >> ${GITHUB_STEP_SUMMARY:-/dev/stdout}
          import json, os
          out = os.environ["OUT"]
          d = json.load(open(os.path.join(out, "train_log.json")))
          m, h = d["meta"], d["history"]
          done = m.get("finished")
          print(f"### {m.get('model')} — stage `{m.get('stage')}`\n")
          print("| metric | value |")
          print("|---|---|")
          for k in ("stage", "params", "steps", "max_steps", "finished", "stop_reason",
                    "best_val_loss", "batch_size", "block_size", "tokens_this_invocation",
                    "tokens_per_second", "train_seconds"):
              print(f"| {k} | {m.get(k)} |")
          if done:
              print("\n**Stage FINISHED.** "
                    + ("Run the workflow again with `stage: sft`." if m.get("stage") == "pretrain"
                       else "Model is exported and committed."))
          else:
              print("\n**Stage NOT finished.** Re-run this workflow with the same "
                    "`model` and `stage` — it resumes from the checkpoint.")
          print("\n<details><summary>loss history (last 16)</summary>\n")
          print("```")
          for e in h[-16:]:
              print(e)
          print("```")
          print("</details>")
          PY
          else
            echo "::warning::no train_log.json produced"
          fi

      # ---- publish (model/spore/** only — runs/ is gitignored) ----------
      - name: Publish artefacts
        run: |
          set -euo pipefail
          MODEL="${{ inputs.model || 'spore-1-12M' }}"
          OUT="runs/$MODEL"
          DEST="model/spore/$MODEL"
          # Two things can be published:
          #   * a finished stage (finished=True) — always wins, overwrites
          #   * a chunk that stopped for time (finished=False) — published as a
          #     *preview* so the demo is usable mid-training. weights.json
          #     loads fine at any step; it just reads worse than the final one.
          OUT="$OUT" python - <<'PY' > /tmp/state.txt
          import json, os, pathlib
          p = pathlib.Path(os.environ["OUT"]) / "train_log.json"
          if not p.exists():
              print("missing")
          else:
              meta = json.loads(p.read_text())["meta"]
              print("finished" if meta.get("finished") else "chunk")
          PY
          STATE=$(cat /tmp/state.txt)
          if [ "$STATE" = "missing" ]; then
            echo "::notice::no train_log.json — nothing to publish"
          elif [ ! -f "$OUT/weights.json" ]; then
            echo "::notice::no exported weights.json — nothing to publish "
            echo "          (train_spore.py exports on chunk stops only with --export)"
          else
            mkdir -p "$DEST"
            for f in weights.json config.json tokenizer.json loss_curve.svg samples.txt train_log.json; do
              [ -f "$OUT/$f" ] && cp "$OUT/$f" "$DEST/$f"
            done
            DEST="$DEST" OUT="$OUT" STATE="$STATE" python - <<'PY'
          import json, os, pathlib
          src = pathlib.Path(os.environ["OUT"]) / "train_log.json"
          dest = pathlib.Path(os.environ["DEST"])
          state = os.environ["STATE"]
          payload = json.loads(src.read_text())
          meta = payload["meta"]
          meta["history"] = payload["history"]
          # Mark partial publishes so the UI and the README can say
          # "training in progress" instead of implying the stage is done.
          meta["preview"] = state == "chunk"
          (dest / "meta.json").write_text(json.dumps(meta, indent=2) + "\n")
          label = "published (PREVIEW — stage still training)" if meta["preview"] else "published"
          print(f"{label}: {dest}")
          PY
            du -h "model/spore/$MODEL"/* | sort -h
          fi
          python scripts/update_readme.py || true

      - name: Save checkpoint cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            runs/${{ inputs.model || 'spore-1-12M' }}
            data/spore
          key: spore-ckpt-${{ inputs.model || 'spore-1-12M' }}-${{ inputs.stage || 'pretrain' }}-${{ steps.fp.outputs.data_hash }}-${{ steps.plan.outputs.target_tokens }}-${{ inputs.max_epochs || '4' }}-${{ github.run_id }}

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spore-${{ inputs.model || 'spore-1-12M' }}-${{ inputs.stage || 'pretrain' }}-${{ github.run_number }}
          path: |
            runs/${{ inputs.model || 'spore-1-12M' }}/train_log.json
            runs/${{ inputs.model || 'spore-1-12M' }}/samples.txt
            runs/${{ inputs.model || 'spore-1-12M' }}/loss_curve.svg
            model/spore/${{ inputs.model || 'spore-1-12M' }}
          if-no-files-found: warn
          retention-days: 90

      - name: Commit trained model
        run: |
          set -euo pipefail
          # Exit before touching the index unless the publish step actually
          # produced weights, so a run with nothing trainable never makes an
          # empty commit. A mid-stage *preview* publish does have weights.json,
          # and is committed on purpose: it is what makes the demo work hours
          # before the stage converges.
          MODEL_DIR="model/spore/${{ inputs.model || 'spore-1-12M' }}"
          if [ ! -f "$MODEL_DIR/weights.json" ]; then
            echo "::notice::no published weights for this stage yet — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only model/ and README.md. NEVER runs/ — it is gitignored and a
          # `git add` of an ignored path exits 1, which under `set -e` used to
          # fail this job *after* a successful multi-hour training run.
          git add model/ README.md 2>/dev/null || git add model/
          if git diff --cached --quiet; then
            echo "no model changes to commit"
            exit 0
          fi
          NAME=$(python -c "import json;print(json.load(open('$MODEL_DIR/meta.json')).get('model','spore'))" 2>/dev/null || echo spore)
          # Signal partial publishes in the commit subject so `git log` on main
          # never reads as though the stage had converged.
          TAG=$(python -c "import json;m=json.load(open('$MODEL_DIR/meta.json'));print(' (preview, step %s/%s)' % (m.get('steps'),m.get('max_steps'))) if m.get('preview') else ''" 2>/dev/null || echo "")
          git commit -m "spore: ${NAME} update${TAG} [skip ci]"

          # `main` may have moved while this job trained: another model's run
          # can finish first, or a PR can merge. A bare `git push` then fails
          # as non-fast-forward and the whole result is stranded -- the failure
          # lands *after* hours of work, behind a green "publish succeeded".
          # Rebase onto whatever main is now, then push. Retry, because the
          # window can reopen between the rebase and the push.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "::notice::pushed model commit on attempt $attempt"
                exit 0
              fi
            else
              # A real conflict means two runs edited the same model file in
              # a way git cannot merge. Abort and report; never force.
              git rebase --abort || true
              echo "::error::rebase onto main conflicted; not forcing a push."
              echo "::error::Re-run this stage: it will resume from the cache,"
              echo "::error::re-publish, and retry the commit on a clean base."
              exit 1
            fi
            echo "::warning::push rejected on attempt $attempt; retrying"
            sleep 5
          done
          echo "::error::could not push the model commit after 3 attempts."
          echo "::error::The weights are safe in the cache; re-run this stage."
          exit 1

      # ---- advisory test gate -------------------------------------------
      # Runs *after* publishing so a flaky test can never throw away a chunk.
      - name: Test suite (advisory)
        if: always()
        continue-on-error: true
        run: |
          if python -c "import pytest" 2>/dev/null; then
            pytest tests/test_spore.py tests/test_tokenizer.py -q || true
          else
            echo "::warning::pytest unavailable — skipping advisory tests"
          fi
